name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      forms-mongo:
        image: mongo:8.2
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      forms-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: forms_recipients_test
          POSTGRES_PASSWORD: forms-recipients-isolated
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forms_recipients_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FORM_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5434/forms_recipients_test
      UNIT_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5434/forms_recipients_test
      WORKSPACE_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5434/forms_recipients_test
      FORM_TEST_MONGODB_URI: mongodb://127.0.0.1:27017

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify
